name: Feature Request
description: Something you'd like to see in OpenNative
title: "[Request]: "
labels: enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for focused OpenNative feature requests.

  - type: textarea
    id: describe-the-request
    attributes:
      label: Feature Request
      placeholder: It would be cool if...
    validations:
      required: true

  - type: checkboxes
    id: request-already-searched
    attributes:
      label: New Feature
      description: Is the request not already listed in [OpenNative Issues](https://github.com/RemiPelloux/OpenNative/issues?q=is%3Aissue%20state%3Aopen%20label%3Aenhancement)?
      options:
        - label: I have searched and did not find my request already listed.
          required: true
